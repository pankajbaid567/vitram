# Render Blueprint: PostgreSQL + API + reminder worker + static web (with an /api rewrite to the API).
# CONFIG ONLY: written against Render's blueprint spec but not deployed by the author. Read docs/DEPLOY.md first.
# Copy to the repository root as render.yaml (Render looks for it there) or point the Blueprint at deploy/render.yaml.
databases:
  - name: vitram-db
    plan: basic-256mb
    databaseName: vitram
    user: vitram

services:
  - type: web
    name: vitram-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/ready
    envVars:
      - {key: ENV, value: production}
      - {key: DATABASE_URL, fromDatabase: {name: vitram-db, property: connectionString}}   # `postgres://` is normalised to postgresql+psycopg:// by the app
      - {key: AUTO_MIGRATE, value: "true"}        # fine for one instance; use a pre-deploy command for several
      - {key: RUN_SCHEDULER, value: "false"}      # the worker below sends reminders
      - {key: RATE_LIMIT_BACKEND, value: database}
      - {key: LOG_FORMAT, value: json}
      - {key: FORWARDED_ALLOW_IPS, value: "*"}    # Render's proxy terminates TLS in front of the container
      - {key: VITRAM_DATA_KEY, sync: false}        # Fernet key: set once, back it up separately
      - {key: APP_ORIGIN, sync: false}             # the web URL below, e.g. https://vitram-web.onrender.com
      - {key: PUBLIC_API_URL, sync: false}         # the same web URL: webhooks arrive via the /api rewrite
      - {key: WHATSAPP_PROVIDER, value: meta}
      - {key: WHATSAPP_TOKEN, sync: false}
      - {key: WHATSAPP_PHONE_NUMBER_ID, sync: false}
      - {key: WHATSAPP_APP_SECRET, sync: false}
      - {key: WHATSAPP_VERIFY_TOKEN, sync: false}
      - {key: WHATSAPP_REMINDER_TEMPLATE, sync: false}
      - {key: GEMINI_API_KEY, sync: false}
      - {key: GEMINI_MODEL, sync: false}
      - {key: TWILIO_ACCOUNT_SID, sync: false}
      - {key: TWILIO_AUTH_TOKEN, sync: false}
      - {key: TWILIO_VERIFY_SERVICE_SID, sync: false}
    disk:   # uploaded files are stored on disk (encrypted); they need a persistent volume
      name: vitram-data
      mountPath: /data
      sizeGB: 5

  - type: worker
    name: vitram-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m app.worker
    plan: starter
    envVars:
      - {key: ENV, value: production}
      - {key: DATABASE_URL, fromDatabase: {name: vitram-db, property: connectionString}}
      - {key: RATE_LIMIT_BACKEND, value: database}
      - {key: LOG_FORMAT, value: json}
      - {key: VITRAM_DATA_KEY, sync: false}
      - {key: APP_ORIGIN, sync: false}
      - {key: WHATSAPP_PROVIDER, value: meta}
      - {key: WHATSAPP_TOKEN, sync: false}
      - {key: WHATSAPP_PHONE_NUMBER_ID, sync: false}
      - {key: WHATSAPP_REMINDER_TEMPLATE, sync: false}

  - type: web
    name: vitram-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - {type: rewrite, source: /api/*, destination: https://vitram-api.onrender.com/api/*}   # keep the browser same-origin
      - {type: rewrite, source: /*, destination: /index.html}                                  # client-side routing
