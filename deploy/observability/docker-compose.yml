# Local observability stack: Prometheus (metrics + alerts), Grafana (dashboard), Jaeger (traces).
#   echo -n "$METRICS_TOKEN" > deploy/observability/metrics_token
#   docker compose -f deploy/observability/docker-compose.yml up -d
# Run the API with METRICS_TOKEN=<same token> and OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
# Grafana http://localhost:3000 (anonymous viewer), Prometheus http://localhost:9090, Jaeger http://localhost:16686
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./metrics_token:/etc/prometheus/metrics_token:ro
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    ports: ["16686:16686", "4318:4318"]
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
