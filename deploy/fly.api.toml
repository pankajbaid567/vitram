# Fly.io: API + reminder worker as two processes of one app. CONFIG ONLY: not deployed by the author.
#   fly launch --no-deploy --copy-config --config deploy/fly.api.toml --name vitram-api
#   fly postgres create && fly postgres attach <pg-app> -a vitram-api
#   fly volumes create vitram_data --size 5 -a vitram-api
#   fly secrets set VITRAM_DATA_KEY=… APP_ORIGIN=https://vitram-web.fly.dev … -a vitram-api
#   cd backend && fly deploy --config ../deploy/fly.api.toml
app = "vitram-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "production"
  RATE_LIMIT_BACKEND = "database"
  LOG_FORMAT = "json"
  FORWARDED_ALLOW_IPS = "*"

[deploy]
  release_command = "python -m app.migrate upgrade"   # migrations (with a backup on SQLite) run once per release, not per instance

[processes]
  api = "sh -c 'RUN_SCHEDULER=false uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*'"
  worker = "python -m app.worker"

[[mounts]]
  source = "vitram_data"
  destination = "/data"
  processes = ["api", "worker"]

[http_service]
  processes = ["api"]
  internal_port = 8000
  force_https = true
  [[http_service.checks]]
    path = "/api/ready"
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
