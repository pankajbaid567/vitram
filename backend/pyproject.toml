[project]
name = "vitram-backend"
version = "0.1.0"
description = "VITTRM API — financial profile, document intelligence, deterministic finance engine and Vitt Saathi orchestration"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "pypdf>=4.2",
  "cryptography>=42",
  "httpx>=0.27",
  "alembic>=1.13",
  "twilio>=9",
  "pillow>=10",  # photo/scan preparation (EXIF stripping, downscaling) in the vision pipeline
]

[project.optional-dependencies]
ai = ["google-genai>=1.0"]
postgres = [
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "reportlab>=4", "freezegun>=1.5", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_ocr: uses the real Apple Vision helper (macOS with Swift only); opt in with `pytest -m real_ocr`"]
addopts = "-m 'not real_ocr'"
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [".venv", ".data"]

[tool.ruff.lint]
select = ["E9", "F", "B"]
ignore = [
  "B008",  # FastAPI's Depends() in argument defaults is the framework idiom
  "B023",  # the closures it flags (insurance.py, parser.py, make_fixtures.py) run inside the loop iteration that defines them
  "B905",  # zip() over equal-length sequences built together
]
