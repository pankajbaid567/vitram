[project]
name = "vitram-backend"
version = "0.1.0"
description = "VITTRM API — financial profile, document intelligence, deterministic finance engine and Vitt Saathi orchestration"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "pypdf>=4.2",
  "cryptography>=42",
  "httpx>=0.27",
  "alembic>=1.13",
  "twilio>=9",
]

[project.optional-dependencies]
ai = ["google-genai>=1.0"]
postgres = [
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = ["pytest>=8", "reportlab>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
