name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vitram
          POSTGRES_PASSWORD: vitram
          POSTGRES_DB: vitram
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vitram" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra ai --extra postgres --extra otel --extra redis --extra s3
      - name: Lint
        if: matrix.db == 'sqlite'
        run: uv run ruff check .
      - name: API reference is current
        if: matrix.db == 'sqlite'
        run: uv run python scripts/export_openapi.py --check
      - name: Test (SQLite, with coverage gate)
        if: matrix.db == 'sqlite'
        run: uv run pytest -q --cov=app --cov-report=term --cov-fail-under=80
      - name: Test (PostgreSQL; the migration tests are SQLite-specific)
        if: matrix.db == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql+psycopg://vitram:vitram@localhost:5432/vitram
        run: uv run pytest -q --deselect tests/test_migrations.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Python runtime dependencies
        working-directory: backend
        run: |
          uv export --frozen --no-hashes --no-dev --extra ai --extra postgres --no-emit-project > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip
      - name: npm dependencies
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high

  e2e:
    name: End-to-end (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the API on a throwaway database
        working-directory: backend
        env:
          APP_ORIGIN: http://localhost:5173
          DATABASE_URL: sqlite:///${{ runner.temp }}/e2e.db
          DATA_DIR: ${{ runner.temp }}/data
          THROTTLE_ENABLED: "false"   # the browser audits fire hundreds of requests from one client in a minute
        run: |
          uv sync --frozen
          nohup uv run uvicorn app.main:app --port 8000 > ${{ runner.temp }}/api.log 2>&1 &
      - name: Build and serve the web app
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npm run preview -- --host 127.0.0.1 --port 5173 --strictPort > ${{ runner.temp }}/web.log 2>&1 &
          curl --retry 40 --retry-connrefused --retry-delay 1 -sf http://localhost:5173/api/health
      - name: Drive the demo path in Chrome
        working-directory: frontend
        run: node scripts/e2e.mjs
      - name: Real-user journey, desktop (sign up → onboarding → statement → loans → cards → EMIs → insurance → assistant → export → delete)
        working-directory: frontend
        run: node scripts/e2e-journey.mjs
      - name: Real-user journey, phone width
        working-directory: frontend
        run: node scripts/e2e-journey.mjs --width 390
      - name: Accessibility audit (axe on every route + keyboard checks)
        working-directory: frontend
        run: node scripts/a11y-audit.mjs
      - name: Show logs on failure
        if: failure()
        run: tail -n 80 ${{ runner.temp }}/api.log ${{ runner.temp }}/web.log

