name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vitram
          POSTGRES_PASSWORD: vitram
          POSTGRES_DB: vitram
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vitram" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra ai --extra postgres
      - name: Lint
        if: matrix.db == 'sqlite'
        run: uv run ruff check .
      - name: Test (SQLite, with coverage gate)
        if: matrix.db == 'sqlite'
        run: uv run pytest -q --cov=app --cov-report=term --cov-fail-under=80
      - name: Test (PostgreSQL; the migration tests are SQLite-specific)
        if: matrix.db == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql+psycopg://vitram:vitram@localhost:5432/vitram
        run: uv run pytest -q --deselect tests/test_migrations.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
