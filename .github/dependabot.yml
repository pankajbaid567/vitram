version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: {interval: weekly}
    groups:
      python-minor-and-patch: {update-types: [minor, patch], patterns: ["*"]}
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    groups:
      npm-minor-and-patch: {update-types: [minor, patch], patterns: ["*"]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
  - package-ecosystem: docker
    directory: /backend
    schedule: {interval: monthly}
  - package-ecosystem: docker
    directory: /frontend
    schedule: {interval: monthly}
